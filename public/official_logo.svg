<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#023e8a"/>
      <stop offset="50%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#0096c7"/>
    </linearGradient>

    <linearGradient id="greenGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0466c8"/>
      <stop offset="30%" stop-color="#059669"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)" filter="url(#dropShadow)" />

  <!-- Outer Ring Swoosh - Dark Blue (Left side) -->
  <path d="M 120 160 A 180 180 0 1 0 250 430 A 180 180 0 0 0 430 250" fill="none" stroke="url(#blueGradient)" stroke-width="22" stroke-linecap="round"/>

  <!-- Outer Ring Swoosh - Green Growth (Right side & Arrow bottom) -->
  <path d="M 250 430 A 180 180 0 0 0 430 250 A 180 180 0 0 0 310 90" fill="none" stroke="url(#greenGradient)" stroke-width="22" stroke-linecap="round"/>

  <!-- Inner Concentric Archs -->
  <path d="M 150 190 A 140 140 0 0 0 250 390 A 140 140 0 0 0 390 250" fill="none" stroke="url(#blueGradient)" stroke-width="10" opacity="0.8"/>

  <!-- Bottom Upward Arrows -->
  <g transform="translate(230, 370)">
    <!-- Small Bottom Arrow 1 -->
    <path d="M -50 20 Q -10 -10 30 -30 L 25 -42 L 50 -25 L 35 5 L 28 -12 Q -5 5 -45 32 Z" fill="url(#blueGradient)"/>
    <!-- Small Bottom Arrow 2 -->
    <path d="M -10 35 Q 30 15 70 -15 L 63 -28 L 90 -10 L 75 20 L 68 3 Q 32 28 -5 45 Z" fill="url(#greenGradient)"/>
  </g>

  <!-- Smartphone Outline (Top Center) -->
  <g transform="translate(190, 65)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="95" height="150" rx="16" fill="#ffffff" stroke="url(#blueGradient)" stroke-width="8" filter="url(#dropShadow)"/>
    <!-- Phone Screen Speaker Bar -->
    <line x1="32" y1="12" x2="63" y2="12" stroke="#0077b6" stroke-width="4" stroke-linecap="round"/>
    <!-- Green Line Chart Inside Screen -->
    <polyline points="15,110 35,90 50,105 80,65" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Giant Upward Green Arrow -->
  <g filter="url(#dropShadow)">
    <path d="M 130 235 L 205 165 L 250 200 L 375 95 L 350 150 L 385 155 L 395 80 L 320 90 L 335 115 Z" fill="url(#greenGradient)"/>
    
    <!-- White Lightning Cutout inside Green Arrow -->
    <polygon points="305,170 290,190 305,190 285,215 315,185 300,185" fill="#ffffff"/>
  </g>

  <!-- Gold Lightning Bolt -->
  <g filter="url(#dropShadow)" transform="translate(305, 170)">
    <polygon points="20,0 0,35 18,35 5,65 38,25 18,25" fill="url(#goldGradient)"/>
  </g>

  <!-- Golden Sparkle Star (Top Right) -->
  <g transform="translate(330, 80)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="url(#goldGradient)"/>
  </g>

  <!-- CENTER BRAND TEXT BANNER -->
  <g transform="translate(250, 280)" text-anchor="middle">
    <!-- Drop Shadow Background for Text legibility -->
    <rect x="-210" y="-35" width="420" height="65" rx="12" fill="#ffffff" opacity="0.95" filter="url(#dropShadow)"/>

    <!-- Main Khmer Title: លុយឆក&លុយឈ្នួល -->
    <text x="0" y="10" font-family="'Kantumruy Pro', 'Battambang', 'Khmer OS Siemreap', 'Moul', sans-serif" font-weight="900" font-size="38" fill="#03045e" letter-spacing="-0.5">
      លុយឆក&amp;លុយឈ្នួល
    </text>
  </g>

  <!-- SUBTITLE PILL: កម្មវិធីកត់ត្រា -->
  <g transform="translate(250, 345)" text-anchor="middle">
    <!-- Green Pill Background -->
    <rect x="-110" y="-22" width="220" height="42" rx="21" fill="url(#greenGradient)" filter="url(#dropShadow)"/>
    <!-- White Subtitle Text -->
    <text x="0" y="6" font-family="'Kantumruy Pro', 'Battambang', 'Khmer OS Siemreap', sans-serif" font-weight="800" font-size="21" fill="#ffffff">
      កម្មវិធីកត់ត្រា
    </text>
  </g>
</svg>
